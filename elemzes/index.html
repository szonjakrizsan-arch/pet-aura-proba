<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0f38">
<title>Aura Scanner – az aura születése</title>
<style>
@font-face{font-family:Cormorant;font-weight:600;src:url(cormorant-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cormorant;font-weight:600;src:url(cormorant-600-ext.woff2) format("woff2");unicode-range:U+0100-024F}
html,body{margin:0;height:100%;background:#1a0f38;color:#f6e7c1;font-family:Cormorant,Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{background:#1a0f38 url(hatter.jpg) center top/cover no-repeat}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);box-sizing:border-box}
.stage{position:relative;width:min(84vw,360px,52dvh);aspect-ratio:1;margin-top:-6dvh}
/* hajszálvékony, ellentétesen forgó arany gyűrűk a keret mögött */
.rings{position:absolute;inset:-34%;pointer-events:none}
.rings svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rings g{transform-origin:0 0;transform-box:view-box}
.r1{animation:cw 46s linear infinite}.r2{animation:ccw 62s linear infinite}.r3{animation:cw 84s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes ccw{to{transform:rotate(-360deg)}}
.rings .rose{opacity:0;transition:opacity 1s ease}
.p2 .rings .rose{opacity:.75}
.p2 .rings .r1,.p2 .rings .r2,.p2 .rings .r3{animation-play-state:paused}
/* fényrétegek a keret mögött */
.lay{position:absolute;inset:-30%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.6s ease;filter:blur(12px)}
.gold{background:radial-gradient(closest-side,transparent 52%,#ffcf7a66 64%,#f3b45a30 78%,transparent 96%)}
.turq{background:radial-gradient(circle at 24% 62%,#5fe3d6aa 0,#3cc8c044 26%,transparent 50%),radial-gradient(circle at 78% 34%,#4fd8ce88 0,#3cc8c033 24%,transparent 46%);animation:drift 9s ease-in-out infinite alternate}
.viol{background:radial-gradient(closest-side,#e9dcff99 0,#c49affaa 34%,#9a6cf066 58%,#b7e6ff22 76%,transparent 96%);transform:scale(.3);transition:opacity 1.4s ease,transform 2.6s cubic-bezier(.2,.7,.2,1)}
@keyframes drift{from{transform:translate(-4%,3%) rotate(-6deg)}to{transform:translate(4%,-3%) rotate(6deg)}}
.p1 .gold,.p2 .gold,.p3 .gold,.hold .gold{opacity:1}
.p2 .turq,.p3 .turq,.hold .turq{opacity:1}
.p3 .viol,.hold .viol{opacity:1;transform:scale(1)}
.hold .lay{animation:breathe 5s ease-in-out infinite}
.hold .turq{animation:drift 9s ease-in-out infinite alternate}
@keyframes breathe{0%,100%{filter:blur(12px) brightness(.9)}50%{filter:blur(12px) brightness(1.15)}}
/* a három szín egyetlen fénykoszorúvá olvad */
.crown{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;opacity:0;filter:blur(7px);
 background:conic-gradient(from 0deg,#ffd98a,#5fe3d6,#c49aff,#ffd98a,#5fe3d6,#c49aff,#ffd98a);
 -webkit-mask:radial-gradient(closest-side,transparent 66%,#000 74%,#000 82%,transparent 96%);mask:radial-gradient(closest-side,transparent 66%,#000 74%,#000 82%,transparent 96%)}
.fin .crown{opacity:1;animation:crown 3s ease-in-out forwards}
@keyframes crown{0%{opacity:0;transform:rotate(0) scale(.92)}45%{opacity:1}100%{opacity:1;transform:rotate(200deg) scale(1.06);filter:blur(5px) brightness(1.25)}}
/* portré */
.ph{position:absolute;left:12%;top:12%;width:76%;height:76%;border-radius:50%;overflow:hidden;background:#0d0820}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.66) saturate(.8);transition:filter 2.4s ease}
.p3 .ph img,.hold .ph img,.fin .ph img{filter:none}
.geo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.geo *{fill:none;stroke:#ffe2a0;stroke-width:.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.p1 .geo{animation:geofade 3.4s ease forwards}
.p1 .geo *{animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes geofade{0%{opacity:0}15%,70%{opacity:.55}100%{opacity:0}}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;overflow:hidden;border-radius:50%;opacity:0;transition:opacity .8s;-webkit-mask:url(portrekeret.png) center/100% 100%;mask:url(portrekeret.png) center/100% 100%}
.shine i{position:absolute;inset:-10%;background:conic-gradient(from 0deg,transparent 0 240deg,#ffd98a55 280deg,#fff3c8ee 312deg,#ffd98a55 340deg,transparent 360deg);animation:cw 2.6s linear infinite}
.p1 .shine{opacity:1}.p2 .shine,.p3 .shine,.hold .shine{opacity:.45}
.p2 .shine i,.p3 .shine i,.hold .shine i{animation-duration:9s}
/* suttogó felirat */
.cap{position:relative;height:56px;width:100%;margin-top:7dvh;text-align:center}
.cap span{position:absolute;left:0;right:0;top:0;font-size:19px;font-style:italic;line-height:1.25;color:#f3d58a;text-shadow:0 0 12px #ffcf7a77,0 1px 3px #000;opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease}
.cap span.on{opacity:1;transform:none}
.gems{display:flex;gap:14px;margin-top:4px}
.gems i{width:9px;height:9px;transform:rotate(45deg);border:1px solid #e8b95a88;background:#2a126088;transition:all .9s ease}
.gems i.on:nth-child(1){background:#ffd98a;box-shadow:0 0 10px #ffcf7a}
.gems i.on:nth-child(2){background:#5fe3d6;box-shadow:0 0 10px #3cc8c0}
.gems i.on:nth-child(3){background:#c49aff;box-shadow:0 0 10px #9a6cf0}
.gems i.skip{display:none}
.gems i{position:relative}
.gems i:nth-child(2)::after{content:'';position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border-radius:50%;pointer-events:none;opacity:0;
 background:repeating-conic-gradient(from 0deg,#9ffff6 0 1.2deg,transparent 1.2deg 22.5deg);-webkit-mask:radial-gradient(closest-side,transparent 9%,#000 14%,transparent 100%);mask:radial-gradient(closest-side,transparent 9%,#000 14%,transparent 100%)}
.gems i.on:nth-child(2)::after{animation:rays 2.4s ease-out 1}
@keyframes rays{0%{opacity:0;transform:scale(.2)}25%{opacity:.95}100%{opacity:0;transform:scale(1.15) rotate(18deg)}}
/* selyemfátyol */
.veil{position:fixed;inset:-20%;pointer-events:none;opacity:0;z-index:9;background:linear-gradient(115deg,transparent 30%,#fff6e6cc 46%,#f3e6ffee 52%,#e6fbffcc 58%,transparent 72%);background-size:300% 100%;background-position:120% 0}
.fin .veil{animation:veil 2.2s ease-in-out 1.5s forwards}
@keyframes veil{0%{opacity:0;background-position:120% 0}30%{opacity:1}100%{opacity:1;background-position:-10% 0}}
.white{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#fffaf0,#efe2ff 60%,#d9c4ff);opacity:0;pointer-events:none;z-index:10;transition:opacity 1.4s ease}
.white.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas class="fx" id="dust"></canvas>
<div class="screen" id="scr">
 <div class="stage" id="stage">
  <div class="rings"><svg viewBox="-100 -100 200 200"><g class="r1" id="r1"></g><g class="r2" id="r2"></g><g class="r3" id="r3"></g><g class="rose" id="rose"></g></svg></div>
  <div class="lay gold"></div><div class="lay turq"></div><div class="lay viol"></div><div class="crown"></div>
  <div class="ph"><img id="img" alt=""><svg class="geo" viewBox="-100 -100 200 200" id="geo"></svg></div>
  <img class="frame" src="portrekeret.png" alt=""><div class="shine"><i></i></div>
 </div>
 <div class="cap" id="cap" aria-live="polite"><span id="c1">A születési csillagállás hangolása…</span><span id="c2">A tér és a Feng Shui energiák olvasása…</span><span id="c3">A testbeszéd üzeneteinek olvasása…</span><span id="c4">A három energia összehangolása…</span><span id="c5">A lélek rezgéseinek egyesítése…</span></div>
 <div class="gems" id="gems"><i></i><i></i><i></i></div>
</div>
<div class="veil"></div><div class="white" id="white"></div>
<script>
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scr=$('scr');
try{const p=sessionStorage.getItem('aura_portre');if(p)$('img').src=p}catch(e){}
/* gyűrűk: hajszálvékony arany körök osztásokkal */
const tick=(r1,r2,a)=>{const t=a*Math.PI/180;return `<line x1="${Math.sin(t)*r1}" y1="${-Math.cos(t)*r1}" x2="${Math.sin(t)*r2}" y2="${-Math.cos(t)*r2}"/>`};
const ring=(r,n,len,o)=>{let s=`<g fill="none" stroke="#f0c66a" stroke-width=".28" opacity="${o}"><circle r="${r}"/><circle r="${r-len-1.2}"/>`;for(let i=0;i<n;i++)s+=tick(r-len,r,i*360/n);return s+'</g>'};
$('r1').innerHTML=ring(96,72,2.2,.5);$('r2').innerHTML=ring(84,24,3,.42);$('r3').innerHTML=ring(72,12,4,.36);
{let s='<g fill="none" stroke="#9ffff6" stroke-width=".35">';for(let i=0;i<8;i++){const a=i*45*Math.PI/180,L=i%2?80:96,w=i%2?4:6,px=Math.cos(a)*w,py=Math.sin(a)*w;
 s+=`<path d="M${-px} ${-py} L${Math.sin(a)*L} ${-Math.cos(a)*L} L${px} ${py}"/>`}$('rose').innerHTML=s+'</g>'}
/* szent geometria: kirajzolódik a portré felett */
{const F=1.618;let s='';[100/F,100/F/F].forEach(r=>s+=`<circle r="${r}" pathLength="1"/>`);
 for(let i=0;i<6;i++){const a=i*60*Math.PI/180,r=100/F/F;s+=`<circle cx="${Math.cos(a)*r}" cy="${Math.sin(a)*r}" r="${r}" pathLength="1" style="animation-delay:${.15*i}s"/>`}
 const p=k=>[0,1,2].map(i=>{const a=(k+i*120)*Math.PI/180;return (Math.sin(a)*100/F)+','+(-Math.cos(a)*100/F)}).join(' ');
 s+=`<polygon points="${p(0)}" pathLength="1" style="animation-delay:.9s"/><polygon points="${p(180)}" pathLength="1" style="animation-delay:1.1s"/>`;$('geo').innerHTML=s}

/* a folyamat: három hullám, majd várakozás a szerverre, végül a kinyílás */
const GALLERY=Q.get('mod')==='galeria'||(()=>{try{return sessionStorage.getItem('aura_irany')===''&&sessionStorage.getItem('aura_foto')!==null&&Q.get('mod')!=='elo'}catch(e){return false}})();
const SERVER=(+Q.get('ido')||9)*1000,PH=RM?900:3400;
const steps=[['p1','c1',0],...(GALLERY?[]:[['p2','c2',1]]),['p3','c3',2]];
if(GALLERY){$('gems').children[1].classList.add('skip');$('c4').textContent='Az energiák összehangolása…'}
let serverDone=false,phasesDone=false,finished=false;setTimeout(()=>{serverDone=true;tryFinish()},SERVER);
function show(cls,cap,gem){scr.classList.remove('p1','p2','p3','hold');scr.classList.add(cls);document.querySelectorAll('.cap span').forEach(s=>s.classList.toggle('on',s.id===cap));if(gem!=null)$('gems').children[gem].classList.add('on')}
steps.forEach(([cls,cap,gem],i)=>setTimeout(()=>show(cls,cap,gem),500+i*PH));
// a három hullám után: összehangolás – a fények lélegeznek, amíg a tényleges elemzés el nem készül
const capOn=id=>document.querySelectorAll('.cap span').forEach(s=>s.classList.toggle('on',s.id===id));
setTimeout(()=>{scr.classList.add('hold');capOn('c4');setTimeout(()=>{phasesDone=true;tryFinish()},RM?400:2200)},500+steps.length*PH);
function tryFinish(){if(finished||!serverDone||!phasesDone)return;finished=true;
 capOn('c5');scr.classList.add('fin');document.body.classList.add('fin');   // egyesülés: fénykoszorú + felirat, majd lágy elfehéredés
 setTimeout(()=>$('white').classList.add('on'),RM?300:2350);   // a fátyol közben már fehéredik: egyetlen, folyamatos világosodás
 setTimeout(()=>{location.href='../eredmeny/'+(location.search||'')},RM?900:4000)}

/* csillagpor: lassan a portré felé áramló fénypontok */
const dc=$('dust'),dx=dc.getContext('2d');let P=[],next=0,tp=performance.now();
function size(){dc.width=innerWidth*devicePixelRatio;dc.height=innerHeight*devicePixelRatio}size();addEventListener('resize',size);
function spawn(){const f=$('stage').getBoundingClientRect(),a=Math.random()*Math.PI*2,r=f.width*(.62+Math.random()*.5),cls=scr.className;
 const cols=['255,214,130'];if(/p2|p3|hold|fin/.test(cls)&&!GALLERY)cols.push('110,232,222');if(/p3|hold|fin/.test(cls))cols.push('208,172,255');
 P.push({x:f.left+f.width/2+Math.cos(a)*r,y:f.top+f.height/2+Math.sin(a)*r,cx:f.left+f.width/2,cy:f.top+f.height/2,r:1+Math.random()*1.8,dur:3+Math.random()*3,life:0,c:cols[Math.floor(Math.random()*cols.length)],ph:Math.random()*7})}
(function loop(now){const dt=Math.min(.1,(now-tp)/1000);tp=now;const d=devicePixelRatio;dx.clearRect(0,0,dc.width,dc.height);
 if(!RM){next-=dt;while(next<=0&&P.length<40){spawn();next+=-Math.log(1-Math.random())/5}
 P=P.filter(p=>{p.life+=dt/p.dur;if(p.life>=1)return false;const k=.22*dt;p.x+=(p.cx-p.x)*k;p.y+=(p.cy-p.y)*k;
  const al=Math.min(1,p.life*5)*Math.pow(1-p.life,1.1)*(.8+.2*Math.sin(now/1000*2.3+p.ph)),x=p.x*d,y=p.y*d,R=p.r*d*4;
  const g=dx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(255,250,230,${al})`);g.addColorStop(.2,`rgba(${p.c},${al*.9})`);g.addColorStop(1,`rgba(${p.c},0)`);dx.fillStyle=g;dx.beginPath();dx.arc(x,y,R,0,7);dx.fill();return true})}
 requestAnimationFrame(loop)})(tp);
</script>
</body>
</html>
